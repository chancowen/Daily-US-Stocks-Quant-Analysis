function spark(tr){
const v=(tr||[]).filter(x=>x!==null&&x!==undefined);
if(v.length<2)return '';
const W=48,Hh=14,lo=Math.min.apply(null,v),hi=Math.max.apply(null,v),rg=hi-lo||1;

+'<div class="chg" style="color:'+cc+'">'+chTxt+'</div>'
+'<div class="tag" style="color:'+c+';background:color-mix(in srgb,'+c+' 12%,transparent)">'+l+'</div></div>'}).join('');}
renderChips();renderRows();

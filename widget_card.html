document.getElementById('focus').innerHTML='<div style="font-size:12px;color:var(--kimi-color-text-tertiary);margin:2px 0 6px">Focus news & X opinion</div>'+F.map(r=>'<div style="display:flex;gap:8px;align-items:baseline;padding:5px 4px;border-bottom:0.5px solid var(--kimi-color-border)"><span style="font-size:13px;font-weight:500;width:52px;flex-shrink:0">'+r[0]+'</span><span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center;background:'+(XC[r[1]]||XC["n/a"])+'"></span><span style="font-size:12px;color:var(--kimi-color-text-secondary);line-height:1.5">'+r[2]+'</span></div>').join('');}
const counts={};D.forEach(r=>counts[r[4]]=(counts[r[4]]||0)+1);
document.getElementById('stats').innerHTML=["FULL ENTRY","TRANCHE 1/3","WATCHLIST","AVOID/WAIT"].map(s=>{
const[c,l]=SIG[s];return '<div class="stat"><div style="font-size:28px;font-weight:500;color:'+c+'">'+(counts[s]||0)+'</div><div style="font-size:12px;color:var(--kimi-color-text-secondary);margin-top:4px">'+l+'</div></div>'}).join('');
let cur="ALL";
const chips=[["ALL","All"],["FULL ENTRY","Full entry"],["TRANCHE 1/3","Tranche 1/3"],["WATCHLIST","Watchlist"],["AVOID/WAIT","Avoid/wait"]];
function spark(tr){
const v=(tr||[]).filter(x=>x!==null&&x!==undefined);
if(v.length<2)return '';
const W=48,Hh=14,lo=Math.min.apply(null,v),hi=Math.max.apply(null,v),rg=hi-lo||1;
const pts=tr.map((x,i)=>x===null||x===undefined?null:(i/(tr.length-1)*(W-4)+2).toFixed(1)+","+(Hh-2-(x-lo)/rg*(Hh-4)).toFixed(1)).filter(Boolean);
const c=v[v.length-1]>=v[0]?'var(--kimi-color-positive)':'var(--kimi-color-danger)';
return '<svg width="'+W+'" height="'+Hh+'" style="display:block;margin-top:2px"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+c+'" stroke-width="1.5"/></svg>';}
function renderChips(){document.getElementById('chips').innerHTML=chips.map(c=>'<button class="chip'+(cur===c[0]?' on':'')+'" data-k="'+c[0]+'">'+c[1]+' '+(c[0]==='ALL'?D.length:(counts[c[0]]||0))+'</button>').join('');
document.querySelectorAll('#w .chip').forEach(b=>b.onclick=()=>{cur=b.dataset.k;renderChips();renderRows();});}
function renderRows(){
const rows=D.filter(r=>cur==='ALL'||r[4]===cur);
document.getElementById('rows').innerHTML=rows.map(r=>{const[c,l]=SIG[r[4]];
const d=r[5]===null?null:r[5],dc=d===null?'var(--kimi-color-text-tertiary)':d>0?'var(--kimi-color-positive)':d<0?'var(--kimi-color-danger)':'var(--kimi-color-text-tertiary)';
const ch=r[6],cc=ch===null?'var(--kimi-color-text-quaternary)':ch>0?'var(--kimi-color-positive)':ch<0?'var(--kimi-color-danger)':'var(--kimi-color-text-tertiary)';
const chTxt=ch===null?'·':(ch>0?'▲ +':ch<0?'▼ ':'· ')+ch.toFixed(1);
const px=r[9],pxTxt=px===null||px===undefined?'—':'$'+px.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
return '<div class="row"><div class="id"><div style="font-size:14px;font-weight:500">'+r[0]+' <span style="font-size:12px;font-weight:400;color:'+dc+'">'+(d===null?'':(d>0?'+':'')+d.toFixed(1)+'%')+'</span></div><div class="nm">'+r[1]+(r[10]===null||r[10]===undefined?'':' · RSI '+r[10].toFixed(0))+(r[11]?' · '+r[11]:'')+(r[12]?' · '+r[12]:'')+'</div></div>'
+'<div class="px">'+pxTxt+'<div class="pxl">price</div></div>'
+'<div style="width:52px;flex-shrink:0">'+spark(r[8])+'</div>'
+'<div class="mid"><div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,r[3]||0))+'%;background:'+c+'"></div></div></div>'
+'<div class="sc">'+(r[3]===null?'—':r[3].toFixed(1))+'</div>'
+'<div class="chg" style="color:'+cc+'">'+chTxt+'</div>'
+'<div class="tag" style="color:'+c+';background:color-mix(in srgb,'+c+' 12%,transparent)">'+l+'</div></div>'}).join('');}
renderChips();renderRows();
})();
</script>
